[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaintel-ai"
version = "0.1.0"
description = "Explainable pharmacovigilance intelligence from biomedical literature"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "biopython>=1.84,<2",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "networkx>=3.4,<4",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.48,<5",
    "datasets>=3,<5",
    "evaluate>=0.4,<1",
]
dashboard = [
    "streamlit>=1.49,<2",
    "plotly>=5.24,<7",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
all = [
    "transformers>=4.48,<5",
    "datasets>=3,<5",
    "evaluate>=0.4,<1",
    "streamlit>=1.49,<2",
    "plotly>=5.24,<7",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
