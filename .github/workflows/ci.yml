name: PharmaIntel checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and dashboard dependencies
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Lint
        run: python -m ruff check .
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q src scripts dashboard
      - name: Check notebook structure and code syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          notebook = json.loads(Path("notebooks/01_pharmaintel_pipeline.ipynb").read_text())
          assert notebook["nbformat"] == 4
          assert notebook["cells"]
          for cell in notebook["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]))
          print(f"Validated {len(notebook['cells'])} notebook cells")
          PY
