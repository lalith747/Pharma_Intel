<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Ten-stage development pipeline from architecture to repository publication" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bedffe"/>
      <stop offset="0.5" stop-color="#ffea96"/>
      <stop offset="1" stop-color="#ffa600"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="190" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="190" fill="#26000f"/>
    <rect x="1" y="1" width="1198" height="188" rx="15" fill="none" stroke="url(#line)" stroke-opacity="0.45" stroke-width="1.5"/>

    <path d="M70 80 H1132" stroke="#5a1a35" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 80 H1132" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1062" stroke-dashoffset="1062">
      <animate attributeName="stroke-dashoffset" values="1062;0;0;1062" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
    </path>

    <circle r="6" cy="80" fill="#fff" filter="url(#glow)">
      <animate attributeName="cx" values="70;1132;1132" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" text-anchor="middle">
      <!-- node i at x = 70 + 118*i ; light-up time = 0.55*9*i/9 -->
      <g>
        <circle cx="70" cy="80" r="24" fill="#26000f" stroke="#bedffe" stroke-width="2"/>
        <circle cx="70" cy="80" r="24" fill="#bedffe" opacity="0"><animate attributeName="opacity" values="0;0.9;0.25;0.25;0" keyTimes="0;0.02;0.1;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="70" y="86" font-size="18" font-weight="700" fill="#fff">1</text>
        <text x="70" y="132" font-size="14" fill="#f1e3cf">Architecture</text>
      </g>
      <g>
        <circle cx="188" cy="80" r="24" fill="#26000f" stroke="#cce3eb" stroke-width="2"/>
        <circle cx="188" cy="80" r="24" fill="#cce3eb" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.055;0.075;0.15;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="188" y="86" font-size="18" font-weight="700" fill="#fff">2</text>
        <text x="188" y="132" font-size="14" fill="#f1e3cf">PubMed</text>
      </g>
      <g>
        <circle cx="306" cy="80" r="24" fill="#26000f" stroke="#dbe8d8" stroke-width="2"/>
        <circle cx="306" cy="80" r="24" fill="#dbe8d8" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.115;0.135;0.21;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="306" y="86" font-size="18" font-weight="700" fill="#fff">3</text>
        <text x="306" y="132" font-size="14" fill="#f1e3cf">Benchmark</text>
      </g>
      <g>
        <circle cx="424" cy="80" r="24" fill="#26000f" stroke="#e9ecc5" stroke-width="2"/>
        <circle cx="424" cy="80" r="24" fill="#e9ecc5" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.17;0.19;0.27;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="424" y="86" font-size="18" font-weight="700" fill="#fff">4</text>
        <text x="424" y="132" font-size="14" fill="#f1e3cf">Entities</text>
      </g>
      <g>
        <circle cx="542" cy="80" r="24" fill="#26000f" stroke="#f8f1b2" stroke-width="2"/>
        <circle cx="542" cy="80" r="24" fill="#f8f1b2" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.23;0.25;0.33;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="542" y="86" font-size="18" font-weight="700" fill="#fff">5</text>
        <text x="542" y="132" font-size="14" fill="#f1e3cf">Relations</text>
      </g>
      <g>
        <circle cx="660" cy="80" r="24" fill="#26000f" stroke="#ffea96" stroke-width="2"/>
        <circle cx="660" cy="80" r="24" fill="#ffea96" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.285;0.305;0.385;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="660" y="86" font-size="18" font-weight="700" fill="#fff">6</text>
        <text x="660" y="132" font-size="14" fill="#f1e3cf">Evaluation</text>
      </g>
      <g>
        <circle cx="778" cy="80" r="24" fill="#26000f" stroke="#ffd971" stroke-width="2"/>
        <circle cx="778" cy="80" r="24" fill="#ffd971" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.345;0.365;0.445;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="778" y="86" font-size="18" font-weight="700" fill="#fff">7</text>
        <text x="778" y="132" font-size="14" fill="#f1e3cf">Ranking</text>
      </g>
      <g>
        <circle cx="896" cy="80" r="24" fill="#26000f" stroke="#ffc84b" stroke-width="2"/>
        <circle cx="896" cy="80" r="24" fill="#ffc84b" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.405;0.425;0.5;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="896" y="86" font-size="18" font-weight="700" fill="#fff">8</text>
        <text x="896" y="132" font-size="14" fill="#f1e3cf">Graph</text>
      </g>
      <g>
        <circle cx="1014" cy="80" r="24" fill="#26000f" stroke="#ffb726" stroke-width="2"/>
        <circle cx="1014" cy="80" r="24" fill="#ffb726" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.47;0.49;0.56;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="1014" y="86" font-size="18" font-weight="700" fill="#fff">9</text>
        <text x="1014" y="132" font-size="14" fill="#f1e3cf">Dashboard</text>
      </g>
      <g>
        <circle cx="1132" cy="80" r="24" fill="#26000f" stroke="#ffa600" stroke-width="2"/>
        <circle cx="1132" cy="80" r="24" fill="#ffa600" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.25;0.25;0" keyTimes="0;0.53;0.55;0.62;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="1132" y="86" font-size="18" font-weight="700" fill="#fff">10</text>
        <text x="1132" y="132" font-size="14" fill="#f1e3cf">Release</text>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
