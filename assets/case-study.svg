<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Clozapine case study: FAERS Assignment 1 report counts for neutropenia 929, agranulocytosis 244, granulocytopenia 5; Assignment 2 EBGM 50.81 for clozapine-neutropenia" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bedffe"/>
      <stop offset="0.5" stop-color="#fff3a9"/>
      <stop offset="1" stop-color="#ffa600"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="e1" d="M250 150 C400 150 480 70 640 70"/>
    <path id="e2" d="M250 150 C400 150 480 150 640 150"/>
    <path id="e3" d="M250 150 C400 150 480 230 640 230"/>
    <clipPath id="clip"><rect width="1200" height="330" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <rect width="1200" height="330" fill="#26000f"/>
    <rect x="1" y="1" width="1198" height="328" rx="15" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5"/>

    <text x="40" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#bedffe">CASE STUDY  /  CLOZAPINE - NEUTROPENIA</text>

    <!-- edges -->
    <g fill="none" stroke="url(#accent)" stroke-linecap="round">
      <use xlink:href="#e1" stroke-width="9" opacity="0.8"/>
      <use xlink:href="#e2" stroke-width="4" opacity="0.7"/>
      <use xlink:href="#e3" stroke-width="2" opacity="0.7"/>
      <use xlink:href="#e1" stroke="#fff" stroke-width="2" stroke-dasharray="4 14" opacity="0.8"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2s" repeatCount="indefinite"/></use>
      <use xlink:href="#e2" stroke="#fff" stroke-width="2" stroke-dasharray="4 14" opacity="0.8"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.6s" repeatCount="indefinite"/></use>
      <use xlink:href="#e3" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 14" opacity="0.8"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3.2s" repeatCount="indefinite"/></use>
    </g>

    <!-- source node -->
    <g transform="translate(170 150)">
      <circle r="62" fill="none" stroke="#bedffe" stroke-width="1.5"><animate attributeName="r" values="62;86;62" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle r="62" fill="#3a0019" stroke="#bedffe" stroke-width="2.5" filter="url(#glow)"/>
      <text y="-2" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Clozapine</text>
      <text y="22" text-anchor="middle" font-size="12" fill="#bedffe" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FAERS + PubMed</text>
    </g>

    <!-- outcome nodes -->
    <g>
      <rect x="640" y="40" width="300" height="60" rx="14" fill="#3a0019" stroke="#ffa600" stroke-width="2"/>
      <text x="662" y="76" font-size="20" font-weight="700" fill="#fff">Neutropenia</text>
      <text x="920" y="78" text-anchor="end" font-size="30" font-weight="800" fill="#ffc24d">929
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </text>

      <rect x="640" y="120" width="300" height="60" rx="14" fill="#3a0019" stroke="#fff3a9" stroke-width="2"/>
      <text x="662" y="156" font-size="20" font-weight="700" fill="#fff">Agranulocytosis</text>
      <text x="920" y="158" text-anchor="end" font-size="30" font-weight="800" fill="#fff3a9">244
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </text>

      <rect x="640" y="200" width="300" height="60" rx="14" fill="#3a0019" stroke="#bedffe" stroke-width="2"/>
      <text x="662" y="236" font-size="20" font-weight="700" fill="#fff">Granulocytopenia</text>
      <text x="920" y="238" text-anchor="end" font-size="30" font-weight="800" fill="#bedffe">5
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- EBGM badge -->
    <g transform="translate(1040 150)">
      <circle r="92" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="76" fill="#3a0019" stroke="#fff3a9" stroke-width="2" filter="url(#glow)"/>
      <text y="-14" text-anchor="middle" font-size="13" letter-spacing="3" fill="#fff3a9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">EBGM</text>
      <text y="26" text-anchor="middle" font-size="42" font-weight="800" fill="#fff">50.81</text>
    </g>

    <text x="40" y="300" font-size="13" fill="#d9b9b0">Assignment 1: FAERS report counts per source term.   Assignment 2: clozapine-neutropenia EBGM.</text>
    <text x="40" y="320" font-size="13" fill="#d9b9b0">Separate source terms and outcomes. FAERS counts are reporting statistics, not incidence or causal estimates.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
